# .github/workflows/build-gtfs.yml
name: build-gtfs
on:
  schedule:
    - cron: '0 1 * * 1'   # lundi 01:00 UTC (~02:00-03:00 Paris)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install & build
        working-directory: etl
        env:
          GTFS_URL: ${{ secrets.GTFS_URL }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm ci || npm install
          npm test
          npm run build

      - name: Publish to gh-pages (force-push branche orpheline)
        run: |
          cd etl/out
          touch .nojekyll
          git init -q
          git checkout -q --orphan gh-pages
          git config user.name "gtfs-bot"
          git config user.email "gtfs-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "build GTFS $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL absent, notification ignorée"
            exit 0
          fi

          details=""
          if [ "$JOB_STATUS" = "success" ]; then
            title=":white_check_mark: *build-gtfs OK* (${TRIGGER})"
            if [ -f etl/out/manifest.json ]; then
              details=$(jq -r '"\(.stopCount) arrêts · valide jusqu’au \(.validThrough)"' etl/out/manifest.json)
            fi
          else
            title=":x: *build-gtfs ${JOB_STATUS}* (${TRIGGER}) — horaires non publiés"
          fi

          jq -n --arg title "$title" --arg details "$details" --arg url "$RUN_URL" \
            '{text: ([$title, $details, "<\($url)|Voir le run>"] | map(select(. != "")) | join("\n"))}' \
            | curl -sS --fail -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
